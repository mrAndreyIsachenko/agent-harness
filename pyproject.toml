[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Stdlib-only guard utilities for supervised agent runs: syntax pre-flight, file skeletons, test-failure digests."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
